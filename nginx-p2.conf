upstream granian {
    server 127.0.0.1:8787;
    keepalive 128;
}

server {
    listen 80;
    server_name localhost _;

    client_max_body_size 2G;
    access_log off;

    # ── Frappe UI SPA assets (served directly by nginx) ────────────────
    location /assets/ {
        alias /home/ilfs/Public/p2/ui/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Django static files ────────────────────────────────────────────
    location /_/static/ {
        alias /home/ilfs/Public/p2/static/;
        expires 7d;
    }

    location /static/ {
        alias /home/ilfs/Public/p2/static/;
        expires 7d;
    }

    # ── Internal storage (X-Accel-Redirect) ────────────────────────────
    location /internal-storage/ {
        internal;
        alias /home/ilfs/Public/p2/storage/;
        sendfile on;
        tcp_nopush on;
        aio threads;
    }

    # ── Everything else → Granian (S3 data plane + Django SPA) ─────────
    location / {
        proxy_pass http://granian;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
