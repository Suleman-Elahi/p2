[package]
name = "p2_s3_crypto"
version = "0.1.0"
edition = "2021"

[lib]
name = "p2_s3_crypto"
crate-type = ["cdylib"]

[features]
default = ["io_uring"]
io_uring = ["dep:tokio-uring"]

[dependencies]
# pyo3: Python bindings for Rust — zero-overhead FFI
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py312"] }
# hmac + sha2: pure-Rust, constant-time HMAC-SHA256
# sha2/asm enables AVX2 assembly backend (sha256 ~3x faster on AVX2 CPUs)
hmac = "0.12"
sha2 = { version = "0.10", features = ["asm"] }
hex = "0.4"
# md5: fast MD5 for ETag computation
md-5 = "0.10"

# tokio-uring and tokio dependencies
tokio-uring = { version = "0.5.0", optional = true }
tokio = { version = "1.37", features = ["rt", "sync", "time"] }

# Encryption
aes-gcm = "0.10"

# Thread-safe synchronization
parking_lot = "0.12"

# Channels & Buffers
bytes = "1.6"
crossbeam-channel = "0.5"

# Raw OS calls
libc = "0.2"

# UUID for volume generation
uuid = { version = "1.8", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
